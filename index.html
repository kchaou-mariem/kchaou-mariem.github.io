setInterval(()=>{ri=(ri+1)%ROLES.length;$$('#role span').forEach((s,i)=>s.classList.toggle('on',i===ri))},2800);
/* hero: raw points that organise into the name, scatter again on scroll */
const cv=$('#cv'),cx=cv.getContext('2d'),hero=$('#top');let W,H,dpr,P=[],mx=-999,my=-999,cols={ink:'#fff',or:'#f80'},run=true;
function readCols(){const s=getComputedStyle(root);cols={ink:s.getPropertyValue('--ink').trim(),or:s.getPropertyValue('--or').trim()}}
function build(){W=hero.clientWidth;H=hero.clientHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
 const o=document.createElement('canvas');o.width=W;o.height=H;const c=o.getContext('2d'),wide=W>700,f=q=>`800 ${q}px 'Bricolage Grotesque',system-ui,sans-serif`;
 let fs=wide?Math.min(W*.17,210):W*.27;c.font=f(fs);const m=c.measureText(wide?'Mariem Kchaou':'Kchaou').width;if(m>W*.86){fs*=W*.86/m;c.font=f(fs)}
 c.textAlign='center';c.textBaseline='middle';const cy=H*.36;if(wide)c.fillText('Mariem Kchaou',W/2,cy);else{c.fillText('Mariem',W/2,cy-fs*.55);c.fillText('Kchaou',W/2,cy+fs*.55)}
 const d=c.getImageData(0,0,W,H).data,st=wide?5:4;P=[];
 for(let y=0;y<H;y+=st)for(let x=0;x<W;x+=st)if(d[(y*W+x)*4+3]>128)P.push({hx:x,hy:y,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,rx:(Math.random()-.5)*700,ry:(Math.random()-.5)*700,a:Math.random()<.14})}
function loop(){if(run){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);const sp=rm?0:Math.min(sy/(H*.8),1),R=90;
 for(const p of P){p.vx+=(p.hx+p.rx*sp-p.x)*.05;p.vy+=(p.hy+p.ry*sp-p.y)*.05;const dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;if(d<R*R&&!rm){const l=Math.sqrt(d)||1,q=(1-l/R)*6;p.vx+=dx/l*q;p.vy+=dy/l*q}p.vx*=.82;p.vy*=.82;p.x+=p.vx;p.y+=p.vy}
 cx.globalAlpha=.92*(1-sp*.7);cx.fillStyle=cols.ink;for(const p of P)if(!p.a)cx.fillRect(p.x,p.y,2.4,2.4);cx.fillStyle=cols.or;for(const p of P)if(p.a)cx.fillRect(p.x,p.y,3.2,3.2)}
 requestAnimationFrame(loop)}
hero.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});hero.addEventListener('pointerleave',()=>{mx=my=-999});
new IntersectionObserver(e=>{run=e[0].isIntersecting}).observe(hero);

$$('.co-t').forEach(e=>{});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.co-t');if(!c||rm)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--ry',((x-.5)*14)+'deg');c.style.setProperty('--rx',((.5-y)*14)+'deg');c.style.setProperty('--px',x*100+'%');c.style.setProperty('--py',y*100+'%')});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.co-t');if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('.cvl');if(!a)return;e.preventDefault();const f=lang==='fr'?{d:CVF,n:'CV-Mariem-Kchaou-FR.pdf'}:{d:CVE,n:'CV-Mariem-Kchaou-EN.pdf'},bytes=Uint8Array.from(atob(f.d),c=>c.charCodeAt(0));let ok=false;try{const d=window.claude&&claude.use?await claude.use('downloads'):null;if(d){await d.save({filename:f.n,data:bytes});ok=true}}catch(x){if(x&&x.code==='declined')return}
if(!ok){const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),l=document.createElement('a');l.href=u;l.download=f.n;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}});
$$('h2').forEach(h=>h.classList.add('rv','ht'));
const tv=$('#tv'),pp=$('#pprev'),pnx=$('#pnext');
const stp=()=>{const c=$$('#trk .pc');return c.length>1?c[1].getBoundingClientRect().left-c[0].getBoundingClientRect().left:tv.clientWidth*.8};
function pupd(){const mx=tv.scrollWidth-tv.clientWidth,x=tv.scrollLeft,N=$$('#trk .pc').length-1,k=Math.min(N,Math.round(x/stp())+1);pp.disabled=x<4;pnx.disabled=x>mx-4;$('#pfill').style.transform=`scaleX(${mx>0?Math.max(.06,x/mx):1})`;$('#pn').textContent=String(k).padStart(2,'0')+' / '+String(N).padStart(2,'0')}
const go2=d=>{pnx.classList.remove('nudge');tv.scrollTo({left:Math.max(0,Math.round(tv.scrollLeft/stp())+d)*stp(),behavior:rm?'auto':'smooth'})};
pp.onclick=()=>go2(-1);pnx.onclick=()=>go2(1);tv.addEventListener('scroll',pupd,{passive:true});addEventListener('resize',pupd);
render();readCols();build();loop();
pupd();(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{build();layout();pupd()});
</script>
</body>
</html>
